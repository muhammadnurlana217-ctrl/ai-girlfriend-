<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1426">
<title>Kirana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <div class="avatar" id="avatar">K</div>
    <div class="who">
      <h1>Kirana</h1>
      <p id="sub">online</p>
    </div>
    <button class="icon" id="btnSettings" aria-label="Pengaturan">⚙</button>
  </header>

  <section id="log" aria-live="polite"></section>
  <p id="notice" hidden></p>

  <form id="form" autocomplete="off">
    <button type="button" class="icon" id="btnMic" aria-label="Bicara">🎤</button>
    <input id="input" placeholder="Tulis pesan…" aria-label="Pesan">
    <button type="submit" class="icon send" aria-label="Kirim">➤</button>
    <button type="button" class="icon call" id="btnCall" aria-label="Telepon Kirana">📞</button>
  </form>
</main>

<div id="call" hidden>
  <div class="orb" id="orb"><span>K</span></div>
  <h2>Kirana</h2>
  <p id="callStatus">Menghubungkan…</p>
  <button id="btnHang">Akhiri panggilan</button>
</div>

<dialog id="settings">
  <form method="dialog">
    <h2>Pengaturan</h2>
    <label>Penyedia AI
      <select id="provider">
        <option value="gemini">Google Gemini (ada free tier)</option>
        <option value="claude">Claude (Anthropic)</option>
      </select>
    </label>
    <label>API key
      <input id="key" type="password" placeholder="Tempel API key di sini">
    </label>
    <label>Model (opsional)
      <input id="model" placeholder="Kosongkan untuk bawaan">
    </label>
    <label class="check"><input type="checkbox" id="speak"> Bacakan balasan dengan suara di chat teks</label>
    <small>Key hanya disimpan di browser kamu dan dikirim langsung ke penyedia AI. Jangan menaruh key di dalam file kode.</small>
    <div class="row">
      <button value="clear" id="btnClear" type="button">Hapus riwayat</button>
      <button value="ok" id="btnSave">Simpan</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
